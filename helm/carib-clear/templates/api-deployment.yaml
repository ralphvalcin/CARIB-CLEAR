apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carib-clear.api.name" . }}
  labels:
    {{- include "carib-clear.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: carib-clear
  template:
    metadata:
      labels:
        app: carib-clear
    spec:
      serviceAccountName: {{ .Values.global.serviceAccount.name }}
      containers:
        - name: api
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: CARIB_CLEAR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ template "carib-clear.name" . }}-secrets
                  key: database-url
            - name: CARIB_CLEAR_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ template "carib-clear.name" . }}-config
                  key: allowed-origins
            - name: CARIB_CLEAR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ template "carib-clear.name" . }}-secrets
                  key: api-key
                  optional: true
            - name: CARIB_CLEAR_SECRET_BACKEND
              valueFrom:
                secretKeyRef:
                  name: {{ template "carib-clear.name" . }}-secrets
                  key: secret-backend
                  optional: true
            - name: CARIB_CLEAR_TEST_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ template "carib-clear.name" . }}-secrets
                  key: webhook-secret
                  optional: true
            - name: CARIB_CLEAR_WEBHOOK_TIMEOUT_SECONDS
              value: "{{ .Values.api.env.webhookTimeoutSeconds }}"
            - name: CARIB_CLEAR_ENV
              value: "{{ .Values.api.env.env }}"
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.health.readyPath }}
              port: {{ .Values.api.port }}
            initialDelaySeconds: {{ .Values.api.health.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.health.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.health.livePath }}
              port: {{ .Values.api.port }}
            initialDelaySeconds: {{ mul .Values.api.health.initialDelaySeconds 2 }}
            periodSeconds: 30
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
