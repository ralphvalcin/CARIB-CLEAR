{{- if .Values.worker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carib-clear.worker.name" . }}
  labels:
    {{- include "carib-clear.labels" . | nindent 4 }}
    app: carib-clear-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: carib-clear-worker
  template:
    metadata:
      labels:
        app: carib-clear-worker
    spec:
      serviceAccountName: {{ .Values.global.serviceAccount.name }}
      containers:
        - name: worker
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: {{ .Values.worker.command | toJson }}
          # Worker config is derived from values; secret-backed values go in secret.yaml
          env:
            - name: CARIB_CLEAR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ template "carib-clear.name" . }}-secrets
                  key: database-url
            - name: CARIB_CLEAR_ENV
              value: "{{ .Values.worker.env.env }}"
            - name: CARIB_CLEAR_COMPLIANCE_LISTS
              value: "{{ .Values.worker.env.complianceLists }}"
            {{- if .Values.api.env.apiKey }}
            - name: CARIB_CLEAR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ template "carib-clear.name" . }}-secrets
                  key: api-key
                  optional: true
            {{- end }}
            {{- if .Values.api.env.webhookSecret }}
            - name: CARIB_CLEAR_TEST_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ template "carib-clear.name" . }}-secrets
                  key: webhook-secret
                  optional: true
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - "python"
                - "-m"
                - "carib_clear.worker.health"
            initialDelaySeconds: {{ .Values.worker.health.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.health.periodSeconds }}
            failureThreshold: {{ .Values.worker.health.failureThreshold }}
          livenessProbe:
            exec:
              command:
                - "python"
                - "-m"
                - "carib_clear.worker.health"
            initialDelaySeconds: {{ .Values.worker.health.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.health.periodSeconds }}
            failureThreshold: {{ .Values.worker.health.failureThreshold }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
