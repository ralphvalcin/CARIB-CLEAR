# Production overrides for carib-clear.
# Do not commit secrets here; use CI/CD secret injection or external values.

global:
  environment: production
  image:
    repository: carib-clear
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  database:
    url: "postgresql://<user>:<pass>@<host>:5432/caribclear"

api:
  enabled: true
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 65
    scaleDownStabilizationSeconds: 300
    scaleDownPct: 10
  env:
    env: "production"
    allowedOrigins: "https://carib-clear.onrender.com"
    webhookTimeoutSeconds: "10"

worker:
  enabled: true
  replicaCount: 1
  env:
    env: "production"
    complianceLists: "/etc/compliance-lists/compliance_lists.json"
