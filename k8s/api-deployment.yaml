apiVersion: v1
kind: ServiceAccount
metadata:
  name: carib-clear

---
apiVersion: v1
kind: Service
metadata:
  name: carib-clear-api
  labels:
    app: carib-clear
spec:
  selector:
    app: carib-clear
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carib-clear-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carib-clear
  template:
    metadata:
      labels:
        app: carib-clear
    spec:
      serviceAccountName: carib-clear
      containers:
        - name: api
          image: carib-clear:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CARIB_CLEAR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: carib-clear-secrets
                  key: database-url
            - name: CARIB_CLEAR_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: carib-clear-config
                  key: allowed-origins
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
